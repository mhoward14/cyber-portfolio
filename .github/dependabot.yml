# Weekly dependency updates. Minor and patch bumps are grouped into one
# pull request per ecosystem so they arrive as a single reviewable change;
# CI runs the full test suite and build on each one before it can merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Angular's packages must move together, so every Angular update,
      # including major versions, arrives as one pull request.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "typescript", "zone.js"]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
