<aside class="sidebar" [class.is-collapsed]="sidebarCollapsed()">
  <div class="sidebar-brand">
    <span class="sidebar-brand-full">MH.PORTFOLIO</span>
    <span class="sidebar-brand-short">MH</span>
  </div>

  <a href="https://mhoward14.github.io" class="sidebar-link" aria-label="Personal Portfolio">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
    <span class="sidebar-link-label">Home</span>
  </a>

  <div class="sidebar-divider"></div>
  <div class="sidebar-section-label">Tools</div>

  <a routerLink="/crosswalk" routerLinkActive="is-active" class="sidebar-link sidebar-link-crosswalk" aria-label="Framework Crosswalk tool">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
      <path d="M16 3h5v5"></path>
      <path d="M4 20 21 3"></path>
      <path d="M21 16v5h-5"></path>
      <path d="M15 15l6 6"></path>
      <path d="M4 4l5 5"></path>
    </svg>
    <span class="sidebar-link-label">Framework Crosswalk</span>
  </a>

  <a routerLink="/rmf-tracker" routerLinkActive="is-active" class="sidebar-link sidebar-link-rmf" aria-label="RMF Control Tracker tool">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
      <path d="M9 11l3 3L22 4"></path>
      <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
    </svg>
    <span class="sidebar-link-label">RMF Tracker</span>
  </a>

  <a routerLink="/zero-trust" routerLinkActive="is-active" class="sidebar-link sidebar-link-zt" aria-label="Zero Trust Cloud Architecture Explorer tool">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
      <path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4Z"></path>
      <path d="M9 12l2 2 4-4"></path>
    </svg>
    <span class="sidebar-link-label">Zero Trust</span>
  </a>

  <a routerLink="/incident-response" routerLinkActive="is-active" class="sidebar-link sidebar-link-ir" aria-label="Incident Response Playbook Simulator tool">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
      <path d="M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86L7.86 2Z"></path>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span class="sidebar-link-label">IR Simulator</span>
  </a>

  <div class="sidebar-spacer"></div>

  <button type="button" class="sidebar-collapse-btn" (click)="toggleSidebar()" [attr.aria-label]="sidebarCollapsed() ? 'Expand navigation' : 'Collapse navigation'">
    <svg class="sidebar-collapse-icon" [class.is-collapsed]="sidebarCollapsed()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
      <polyline points="11 17 6 12 11 7"></polyline>
      <polyline points="18 17 13 12 18 7"></polyline>
    </svg>
    <span class="sidebar-link-label">Collapse</span>
  </button>
</aside>
