# ============================================================
# GitHub Pages Deployment
# Builds the Angular app and publishes it to GitHub Pages
# whenever a commit is pushed to the main branch.
#
# Live URL: https://mhoward14.github.io/cyber-portfolio/
#
# FIRST-TIME SETUP (one-time manual step):
#   GitHub repo → Settings → Pages
#   → Source: "GitHub Actions"  ← select this, then save.
#   After that, every push to main auto-deploys.
# ============================================================

name: Deploy to GitHub Pages

on:
  # Runs automatically on every push to main
  push:
    branches: [master]
  # Allows you to trigger a deploy manually from the Actions tab
  workflow_dispatch:

# Deny permissions by default. Each job receives only what it needs.
permissions: {}

# Only allow one deployment at a time; don't cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Job 1: Build ────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # baseHref is already set to /cyber-portfolio/ in angular.json
      # under configurations.production, so no extra flag needed here.
      - name: Build (production)
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Angular static output lands in dist/portfolio-ui/browser/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/portfolio-ui/browser

  # ── Job 2: Deploy ───────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
