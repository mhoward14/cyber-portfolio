# ============================================================
# GitHub Pages Deployment
# Builds the Angular app and publishes it to GitHub Pages
# whenever a commit is pushed to the main branch.
#
# Live URL: https://mhoward14.github.io/cyber-portfolio/
#
# FIRST-TIME SETUP (one-time manual step):
#   GitHub repo → Settings → Pages
#   → Source: "GitHub Actions"  ← select this, then save.
#   After that, every push to main auto-deploys.
# ============================================================

name: Deploy to GitHub Pages

on:
  # Runs automatically on every push to main
  push:
    branches: [master]
  # Allows you to trigger a deploy manually from the Actions tab
  workflow_dispatch:

# Deny permissions by default. Each job receives only what it needs.
permissions: {}

# Only allow one deployment at a time; don't cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Job 1: Build ────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # baseHref is already set to /cyber-portfolio/ in angular.json
      # under configurations.production, so no extra flag needed here.
      - name: Build (production)
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Angular static output lands in dist/portfolio-ui/browser/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/portfolio-ui/browser

  # ── Job 2: Deploy ───────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
