# Weekly dependency updates. Minor and patch bumps are grouped into one
# pull request per ecosystem so they arrive as a single reviewable change;
# CI runs the full test suite and build on each one before it can merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Angular 22 supports TypeScript >=6.0 <6.1 only (its peer range), so a
      # newer major or minor breaks `npm ci`. Patch updates are still proposed.
      # Remove this when an Angular release widens the range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # CI and deploy run Node 22, so keep its type definitions on 22. A newer
      # major describes APIs the runtime does not have. Minor and patch updates
      # are still proposed. Raise this together with .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Angular's packages must move together, so every Angular update,
      # including major versions, arrives as one pull request.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "typescript", "zone.js"]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
