# ============================================================
# CodeQL Security Scanning
# Static analysis of the TypeScript source and the GitHub Actions
# workflows for injection flaws, unsafe DOM use, and workflow
# misconfigurations. Runs on pull requests, on master, and weekly
# so new CodeQL queries are applied to unchanged code too.
# Findings appear under the repository's Security → Code scanning tab.
# ============================================================

name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
